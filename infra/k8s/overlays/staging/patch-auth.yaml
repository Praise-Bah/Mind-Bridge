apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: auth-service
          # The app reads discrete POSTGRES_* vars (DATABASE_URL is ignored),
          # so point them at the Compose auth DB over the bridge gateway.
          env:
            - name: POSTGRES_DB
              value: auth_db
            - name: POSTGRES_HOST
              value: "172.17.0.1"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              value: "redis://172.17.0.1:6379/0"
            - name: REDIS_CACHE_URL
              value: "redis://172.17.0.1:6379/2"
            - name: REDIS_EVENT_BUS_URL
              value: "redis://172.17.0.1:6379/3"
            - name: REDIS_CHANNEL_LAYER_URL
              value: "redis://172.17.0.1:6379/1"
            - name: CELERY_BROKER_URL
              value: "redis://172.17.0.1:6379/0"
