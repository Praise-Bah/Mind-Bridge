apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay: single-replica services on k3s that connect back to the
# Docker Compose Postgres/Redis over the bridge gateway (see
# infra/docker/docker-compose.k3s-bridge.yml). Production stays on Compose.

namespace: mindbridge-staging

resources:
  - namespace.yaml
  - ../../base
  - nodeport-services.yaml

# Replace the placeholder images with GHCR images built by Jenkins.
# Change YOUR_GH_ORG to your GitHub org/user (lowercase).
images:
  - name: mindbridge/auth-service
    newName: ghcr.io/YOUR_GH_ORG/mindbridge-auth-service
    newTag: staging
  - name: mindbridge/content-service
    newName: ghcr.io/YOUR_GH_ORG/mindbridge-content-service
    newTag: staging
  - name: mindbridge/admin-service
    newName: ghcr.io/YOUR_GH_ORG/mindbridge-admin-service
    newTag: staging

patches:
  - path: patch-auth.yaml
  - path: patch-content.yaml
  - path: patch-admin.yaml
