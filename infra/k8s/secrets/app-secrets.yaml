# IMPORTANT: Replace all <base64_encoded_*> values with actual base64-encoded secrets.
# Generate: echo -n "your-value" | base64
# In production, use Sealed Secrets or Vault instead of committing this file.

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mindbridge
type: Opaque
data:
  SECRET_KEY: <base64_encoded_secret_key>
  INTERNAL_SERVICE_TOKEN: <base64_encoded_internal_token>
  GOOGLE_CLIENT_ID: <base64_encoded_google_client_id>
  GOOGLE_CLIENT_SECRET: <base64_encoded_google_client_secret>
  SENDGRID_API_KEY: <base64_encoded_sendgrid_key>
  OPENROUTER_API_KEY: <base64_encoded_openrouter_key>
  YOUTUBE_API_KEY: <base64_encoded_youtube_key>
