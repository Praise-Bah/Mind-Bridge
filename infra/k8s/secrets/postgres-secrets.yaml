# Replace <base64_encoded_*> with actual base64-encoded values.
# Use Sealed Secrets in production — never commit plaintext credentials.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: mindbridge
type: Opaque
data:
  POSTGRES_USER: <base64_encoded_db_user>
  POSTGRES_PASSWORD: <base64_encoded_db_password>
  AUTH_DATABASE_URL: <base64_encoded_postgresql_auth_url>
  CHAT_DATABASE_URL: <base64_encoded_postgresql_chat_url>
  COMMUNITY_DATABASE_URL: <base64_encoded_postgresql_community_url>
  PROFESSIONALS_DATABASE_URL: <base64_encoded_postgresql_professionals_url>
  NOTIFICATIONS_DATABASE_URL: <base64_encoded_postgresql_notifications_url>
  AI_DATABASE_URL: <base64_encoded_postgresql_ai_url>
  CONTENT_DATABASE_URL: <base64_encoded_postgresql_content_url>
