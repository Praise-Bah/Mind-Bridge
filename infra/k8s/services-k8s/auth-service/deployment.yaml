apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: mindbridge
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: mindbridge/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          command:
            - gunicorn
            - core.wsgi:application
            - --bind=0.0.0.0:8001
            - --workers=4
            - --worker-class=sync
            - --threads=2
            - --max-requests=1000
            - --max-requests-jitter=100
            - --timeout=30
            - --graceful-timeout=15
            - --access-logfile=-
          envFrom:
            - configMapRef:
                name: common-env
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: auth-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: AUTH_DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
