  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
  POSTGRES_DB: notifications_db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres-notifications
