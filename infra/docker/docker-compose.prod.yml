# Production Docker Compose — standalone file (NOT an override of phase6).
#
# Use ONLY this file on the VPS:
#   cd infra/docker
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Prerequisites on the VPS:
#   1. Fill in .env.prod (copy from .env.prod.example and set all values)
#   2. If serving frontend locally: cd ../../frontend && npm run build
#      (creates frontend/dist/ which Nginx serves as static files)
#      If using Vercel for the frontend: you can skip the build and set
#      VITE_API_URL=http://YOUR_VPS_IP on Vercel instead.

x-auth-env: &auth-env
  DJANGO_SETTINGS_MODULE: core.settings.production
  DEBUG: "False"
  SECRET_KEY: ${AUTH_SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
  POSTGRES_DB: auth_db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres-auth
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/2
  REDIS_EVENT_BUS_URL: redis://redis:6379/3
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  SITE_URL: ${SITE_URL}
  FRONTEND_URL: ${FRONTEND_URL}

x-community-env: &community-env
  DJANGO_SETTINGS_MODULE: core.settings.production
  DEBUG: "False"
  SECRET_KEY: ${AUTH_SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
  POSTGRES_DB: community_db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres-community
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/2
  REDIS_EVENT_BUS_URL: redis://redis:6379/3
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  AUTH_SERVICE_INTERNAL_URL: http://auth-service:8001
  SITE_URL: ${SITE_URL}

