---
# Installs a single-node k3s cluster for the MindBridge staging lane.
# Traefik and metrics-server are disabled so k3s does not claim ports 80/443
# (owned by the Docker Compose Nginx gateway) and to keep the memory footprint
# low on a shared VPS. Staging services are exposed via NodePort instead.

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: mindbridge_k3s_binary

- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not mindbridge_k3s_binary.stat.exists

- name: Install k3s (no Traefik, no metrics-server)
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_EXEC: "--disable traefik --disable metrics-server --write-kubeconfig-mode 644"
  args:
    creates: /usr/local/bin/k3s
  register: mindbridge_k3s_install

- name: Ensure k3s service is enabled and running
  ansible.builtin.service:
    name: k3s
    enabled: true
    state: started

- name: Wait for the Kubernetes API to become ready
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  register: mindbridge_k3s_readyz
  retries: 20
  delay: 6
  until: mindbridge_k3s_readyz.rc == 0
  changed_when: false

- name: Create kubeconfig directory for the deploy user
  ansible.builtin.file:
    path: "/home/{{ mindbridge_deploy_user }}/.kube"
    state: directory
    owner: "{{ mindbridge_deploy_user }}"
    group: "{{ mindbridge_deploy_user }}"
    mode: "0700"
  when: mindbridge_create_deploy_user | bool

- name: Copy kubeconfig for the deploy user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ mindbridge_deploy_user }}/.kube/config"
    remote_src: true
    owner: "{{ mindbridge_deploy_user }}"
    group: "{{ mindbridge_deploy_user }}"
    mode: "0600"
  when: mindbridge_create_deploy_user | bool

- name: Allow the staging NodePort range through UFW
  ansible.builtin.command: "ufw allow {{ mindbridge_k3s_nodeport_range }}"
  register: mindbridge_k3s_ufw
  changed_when: "'Rules updated' in mindbridge_k3s_ufw.stdout"
  when: mindbridge_enable_firewall | bool
