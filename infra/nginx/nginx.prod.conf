# Nginx API Gateway — VPS production.
# Serves React SPA from /usr/share/nginx/html (built frontend/dist).
# Rate limiting: auth 20 req/min, general API 100 req/min, AI 30 req/min, WebSocket 10 conn/min.

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Rate limiting zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m      rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m      rate=10r/m;

    # ── Upstreams ─────────────────────────────────────────────────────────
    upstream auth_service          { server auth-service:8001;          keepalive 32; }
    upstream chat_service          { server chat-service:8002;          keepalive 32; }
    upstream community_service     { server community-service:8003;     keepalive 32; }
    upstream professionals_service { server professionals-service:8004; keepalive 32; }
    upstream notification_service  { server notification-service:8005;  keepalive 32; }
    upstream ai_service            { server ai-service:8006;            keepalive 16; }
    upstream content_service       { server content-service:8007;       keepalive 32; }
    upstream admin_service         { server admin-service:8008;         keepalive 8;  }

    server {
        listen 80;
        server_name _;   # Replace _ with your domain/IP for production
        client_max_body_size 50M;

        # ── Static frontend (React SPA) ───────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Long-lived cache for hashed assets
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Auth ──────────────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Chat ──────────────────────────────────────────────────────────
        location /api/v1/chat/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://chat_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /ws/chat/ {
            limit_req zone=ws_limit burst=5;
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Community ─────────────────────────────────────────────────────
        location /api/v1/community/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://community_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Professionals ─────────────────────────────────────────────────
        location /api/v1/professionals/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://professionals_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/pro/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://professionals_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Notifications ─────────────────────────────────────────────────
        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://notification_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /ws/notifications/ {
            limit_req zone=ws_limit burst=5;
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── AI (SSE streaming) ────────────────────────────────────────────
        # proxy_buffering off is required for SSE — do not remove.
        location /api/v1/ai/ {
            limit_req zone=ai_limit burst=5 nodelay;
            proxy_pass http://ai_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
        }

        # ── Content ───────────────────────────────────────────────────────
        location /api/v1/journals/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://content_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/videos/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://content_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/achievements/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://content_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Admin (JWT staff permission — no IP restriction needed) ──────
        location /api/v1/admin-panel/ {
            proxy_pass http://admin_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/landing/ {
            proxy_pass http://admin_service;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Health ────────────────────────────────────────────────────────
        location /health/ {
            proxy_pass http://auth_service/api/v1/health/;
            include /etc/nginx/proxy_params;
            access_log off;
        }
    }
}
