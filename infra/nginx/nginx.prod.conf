# Nginx API Gateway — VPS production.
# Serves React SPA from /usr/share/nginx/html (built frontend/dist).
# Rate limiting: auth 20 req/min, general API 100 req/min, AI 30 req/min, WebSocket 10 conn/min.

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Rate limiting zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m      rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m      rate=10r/m;

    # ── Dynamic upstream resolution ───────────────────────────────────────
    # Docker reassigns a *new* internal IP every time it recreates a backend
    # container (deploy, restart, OOM recovery). Static `upstream { server
    # name:port; }` blocks resolve that hostname once at config-load/reload
    # and cache the IP forever — so Nginx keeps routing to the dead IP and
    # returns 502s until someone runs `nginx -s reload`. Pointing `resolver`
    # at Docker's embedded DNS (127.0.0.11) and using *variables* in
    # `proxy_pass` (set per server block below) forces Nginx to re-resolve
    # at request time, respecting this short TTL — so a recreated container's
    # new IP is picked up within ~10s, automatically, with no reload needed.
    # Trade-off: variable-based proxy_pass can't use `upstream{}` `keepalive`
    # pooling (an open-source-Nginx limitation) — negligible at this traffic
    # level for internal docker-network hops, but worth a post-deploy check.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP → HTTPS redirect for api.mindbridge.sbs ─────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name api.mindbridge.sbs;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS — api.mindbridge.sbs (production frontend calls this) ───────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.mindbridge.sbs;
        client_max_body_size 50M;

        # Re-resolved per-request via the `resolver` above (see comment there).
        set $auth_addr          auth-service:8001;
        set $chat_addr          chat-service:8002;
        set $community_addr     community-service:8003;
        set $professionals_addr professionals-service:8004;
        set $notification_addr  notification-service:8005;
        set $ai_addr            ai-service:8006;
        set $content_addr       content-service:8007;
        set $admin_addr         admin-service:8008;

        ssl_certificate     /etc/letsencrypt/live/api.mindbridge.sbs/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mindbridge.sbs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers ──────────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://openrouter.ai wss://api.mindbridge.sbs; font-src 'self' data:;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ── Auth ──────────────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://$auth_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$auth_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Chat ──────────────────────────────────────────────────────────
        location /api/v1/chat/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$chat_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /ws/chat/ {
            limit_req zone=ws_limit burst=5;
            proxy_pass http://$chat_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Community ─────────────────────────────────────────────────────
        location /api/v1/community/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$community_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Professionals ─────────────────────────────────────────────────
        location /api/v1/professionals/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$professionals_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/pro/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$professionals_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Notifications ─────────────────────────────────────────────────
        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://$notification_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /ws/notifications/ {
            limit_req zone=ws_limit burst=5;
            proxy_pass http://$notification_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── AI (SSE streaming) ────────────────────────────────────────────
        location /api/v1/ai/ {
            limit_req zone=ai_limit burst=5 nodelay;
            proxy_pass http://$ai_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
        }

        # ── Content ───────────────────────────────────────────────────────
        location /api/v1/journals/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$content_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/videos/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$content_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/achievements/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$content_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Admin ─────────────────────────────────────────────────────────
        location /api/v1/admin-panel/ {
            proxy_pass http://$admin_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/landing/ {
            proxy_pass http://$admin_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        # ── Health ────────────────────────────────────────────────────────
        location /health/ {
            proxy_pass http://$auth_addr/api/v1/health/;
            include /etc/nginx/proxy_params;
            access_log off;
        }
    }

    # ── Default HTTP server (direct IP access, health checks) ────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        client_max_body_size 50M;

        # Re-resolved per-request via the `resolver` above (see comment there).
        set $auth_addr          auth-service:8001;
        set $chat_addr          chat-service:8002;
        set $community_addr     community-service:8003;
        set $professionals_addr professionals-service:8004;
        set $notification_addr  notification-service:8005;
        set $ai_addr            ai-service:8006;
        set $content_addr       content-service:8007;
        set $admin_addr         admin-service:8008;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://$auth_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$auth_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/chat/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$chat_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/community/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$community_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/professionals/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$professionals_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://$notification_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/ai/ {
            limit_req zone=ai_limit burst=5 nodelay;
            proxy_pass http://$ai_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/v1/videos/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$content_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/journals/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$content_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/achievements/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$content_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /api/v1/admin-panel/ {
            proxy_pass http://$admin_addr;
            include /etc/nginx/proxy_params;
            include /etc/nginx/cors_params;
        }

        location /health/ {
            proxy_pass http://$auth_addr/api/v1/health/;
            include /etc/nginx/proxy_params;
            access_log off;
        }
    }
}
