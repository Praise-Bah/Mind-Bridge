# Nginx — Phase 3 transitional state.
#
# Extracted services:
#   - notification-service:8005 (/api/v1/notifications/, /ws/notifications/)
#   - chat-service:8002         (/api/v1/chat/, /ws/chat/)
#
# Still on monolith:
#   - auth, users, community, professionals, pro, ai (HTTP), journals,
#     videos, achievements, admin-panel, landing
#
# Internal endpoints (/internal/*) are never exposed here — direct
# container-to-container HTTP only.

events {
    worker_connections 1024;
}

http {
    upstream monolith             { server monolith:8000;             keepalive 16; }
    upstream chat_service         { server chat-service:8002;         keepalive 16; }
    upstream notification_service { server notification-service:8005; keepalive 16; }
    upstream frontend             { server frontend:5173;             }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # ── Auth / Users ──────────────────────────────────────────────────
        location /api/v1/auth/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/users/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        # ── Chat (HTTP + WebSocket) — extracted ───────────────────────────
        location /api/v1/chat/ {
            proxy_pass http://chat_service;
            include /etc/nginx/proxy_params;
        }

        location /ws/chat/ {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Community ─────────────────────────────────────────────────────
        location /api/v1/community/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        # ── Professionals ─────────────────────────────────────────────────
        location /api/v1/professionals/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/pro/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        # ── Notifications (HTTP + WebSocket) — extracted ──────────────────
        location /api/v1/notifications/ {
            proxy_pass http://notification_service;
            include /etc/nginx/proxy_params;
        }

        location /ws/notifications/ {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── AI (SSE streaming — still on monolith until Phase 4) ─────────
        location /api/v1/ai/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Content: journals, videos, achievements ───────────────────────
        location /api/v1/journals/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/videos/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/achievements/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        # ── Admin ─────────────────────────────────────────────────────────
        location /api/v1/admin-panel/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        # ── Landing ───────────────────────────────────────────────────────
        location /api/v1/landing/ {
            proxy_pass http://monolith;
            include /etc/nginx/proxy_params;
        }

        # ── Health ────────────────────────────────────────────────────────
        location /health/ {
            proxy_pass http://monolith/api/v1/health/;
            include /etc/nginx/proxy_params;
        }

        # ── Frontend (Vite dev server with HMR) ───────────────────────────
        location /src/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
