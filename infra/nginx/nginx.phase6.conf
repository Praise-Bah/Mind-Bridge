# Nginx — Phase 6 FINAL state. Monolith fully decommissioned.
#
# All traffic handled by extracted services:
#   - auth-service:8001         (/api/v1/auth/, /api/v1/users/)
#   - chat-service:8002         (/api/v1/chat/, /ws/chat/)
#   - community-service:8003    (/api/v1/community/)
#   - professionals-service:8004 (/api/v1/professionals/, /api/v1/pro/)
#   - notification-service:8005 (/api/v1/notifications/, /ws/notifications/)
#   - ai-service:8006           (/api/v1/ai/)
#   - content-service:8007      (/api/v1/journals/, /api/v1/videos/, /api/v1/achievements/)
#   - admin-service:8008        (/api/v1/admin-panel/, /api/v1/landing/)

events {
    worker_connections 1024;
}

http {
    upstream auth_service          { server auth-service:8001;          keepalive 16; }
    upstream chat_service          { server chat-service:8002;          keepalive 16; }
    upstream community_service     { server community-service:8003;     keepalive 16; }
    upstream professionals_service { server professionals-service:8004; keepalive 16; }
    upstream notification_service  { server notification-service:8005;  keepalive 16; }
    upstream ai_service            { server ai-service:8006;            keepalive 16; }
    upstream content_service       { server content-service:8007;       keepalive 16; }
    upstream admin_service         { server admin-service:8008;         keepalive 8;  }
    upstream frontend              { server frontend:5173; }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # ── Auth / Users ──────────────────────────────────────────────────────
        location /api/v1/auth/ {
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/users/ {
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params;
        }

        # ── Chat (HTTP + WebSocket) ───────────────────────────────────────────
        location /api/v1/chat/ {
            proxy_pass http://chat_service;
            include /etc/nginx/proxy_params;
        }

        location /ws/chat/ {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Community ─────────────────────────────────────────────────────────
        location /api/v1/community/ {
            proxy_pass http://community_service;
            include /etc/nginx/proxy_params;
        }

        # ── Professionals ─────────────────────────────────────────────────────
        location /api/v1/professionals/ {
            proxy_pass http://professionals_service;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/pro/ {
            proxy_pass http://professionals_service;
            include /etc/nginx/proxy_params;
        }

        # ── Notifications (HTTP + WebSocket) ──────────────────────────────────
        location /api/v1/notifications/ {
            proxy_pass http://notification_service;
            include /etc/nginx/proxy_params;
        }

        location /ws/notifications/ {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── AI (HTTP + SSE streaming) ─────────────────────────────────────────
        location /api/v1/ai/ {
            proxy_pass http://ai_service;
            include /etc/nginx/proxy_params;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Content: journals, videos, achievements ───────────────────────────
        location /api/v1/journals/ {
            proxy_pass http://content_service;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/videos/ {
            proxy_pass http://content_service;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/achievements/ {
            proxy_pass http://content_service;
            include /etc/nginx/proxy_params;
        }

        # ── Admin Service (aggregator — staff JWT required) ───────────────────
        location /api/v1/admin-panel/ {
            proxy_pass http://admin_service;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/landing/ {
            proxy_pass http://admin_service;
            include /etc/nginx/proxy_params;
        }

        # ── Health ────────────────────────────────────────────────────────────
        location /health/ {
            proxy_pass http://auth_service/api/v1/health/;
            include /etc/nginx/proxy_params;
        }

        # ── Frontend (Vite dev server with HMR) ───────────────────────────────
        location /src/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
