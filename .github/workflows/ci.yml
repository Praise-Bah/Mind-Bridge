name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  lint-build-test:
    name: Lint, type-check, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reports lint issues without failing the build — there's a known backlog of
      # `any`-type cleanup being paid down incrementally, tracked here rather than ignored.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Type-check & build
        run: npm run build

      - name: Run tests
        run: npx vitest run --passWithNoTests
